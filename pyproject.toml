[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-vidlock"
dynamic = ["version"]
description = "Protect course videos in Django: encrypted single-file HLS, per-viewer keys, no DRM licence, no re-encoding."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Nader Yasser", email = "naderyasser023@gmail.com" }]
keywords = [
  "django", "hls", "aes-128", "video", "video-protection", "encryption", "lms", "e-learning",
  "online-courses", "hls-js", "cloudflare-r2", "s3", "gcs", "azure", "ffmpeg", "watermark",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Natural Language :: Arabic",
  "Natural Language :: French",
  "Natural Language :: German",
  "Natural Language :: Portuguese",
  "Natural Language :: Spanish",
  "Natural Language :: Turkish",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Education",
  "Topic :: Multimedia :: Video",
  "Topic :: Security :: Cryptography",
  "Typing :: Typed",
]
dependencies = ["Django>=4.2", "cryptography>=41"]

[project.optional-dependencies]
s3 = ["boto3>=1.28"]
test = ["pytest>=8", "pytest-django>=4.8", "pytest-cov>=5", "cryptography>=42", "celery>=5.3"]
browser = ["playwright>=1.45"]

[project.urls]
Homepage = "https://github.com/naderyasser/django-vidlock"
Issues = "https://github.com/naderyasser/django-vidlock/issues"
Changelog = "https://github.com/naderyasser/django-vidlock/blob/main/CHANGELOG.md"
Security = "https://github.com/naderyasser/django-vidlock/security/policy"

[tool.hatch.version]
path = "src/vidlock/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vidlock"]

[tool.hatch.build.targets.sdist]
include = ["src/vidlock", "tests", "README.md", "CHANGELOG.md", "LICENSE", "SECURITY.md", "CONTRIBUTING.md"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "PLW", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["vidlock", "tests"]

[tool.coverage.run]
source = ["vidlock"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.black]
line-length = 110
target-version = ["py310"]
skip-string-normalization = true
